<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abo — Executive Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #12161D;
    --surface: #1B212B;
    --surface-2: #202836;
    --line: #2B3341;
    --accent: #D98F30;
    --accent-soft: rgba(217,143,48,0.14);
    --expense: #4F8C96;
    --expense-soft: rgba(79,140,150,0.14);
    --profit: #7CA982;
    --loss: #C1666B;
    --text: #EDEAE1;
    --muted: #8A93A3;
    --muted-2: #5D6675;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .wrap{max-width:1240px;margin:0 auto;padding:28px 24px 64px;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:16px;
    padding-bottom:20px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .seal{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;
  }
  .seal::after{
    content:'';width:10px;height:10px;border-radius:50%;
    background:var(--accent);
  }
  .brand-text h1{font-size:17px;margin:0;font-weight:700;letter-spacing:0.02em;}
  .brand-text .sub{font-size:11.5px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}

  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sync{font-size:11px;color:var(--muted-2);font-family:'IBM Plex Mono',monospace;}
  select{
    background:var(--surface);color:var(--text);
    border:1px solid var(--line);border-radius:6px;
    padding:8px 12px;font-family:'Inter';font-size:13px;font-weight:600;
    cursor:pointer;
  }

  .kpi-row{
    display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;
  }
  .kpi{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:600;}
  .kpi .value{font-size:23px;font-weight:600;margin-top:9px;line-height:1.1;}
  .kpi .delta{font-size:11.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .delta.up{color:var(--profit);}
  .delta.down{color:var(--loss);}
  .delta.flat{color:var(--muted-2);}
  .kpi.accent-top::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);
  }
  .kpi.expense-top::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--expense);
  }
  .kpi.profit-top::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--profit);
  }

  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px;}
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:20px 20px 16px;
  }
  .panel h2{
    font-size:12.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);
    margin:0 0 16px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;
  }
  .chart-box{position:relative;height:230px;}
  .chart-box.tall{height:280px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;
    letter-spacing:0.06em;padding:0 6px 8px;font-weight:600;border-bottom:1px solid var(--line);
  }
  thead th.r{text-align:right;}
  tbody td{padding:9px 6px;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  td.r{text-align:right;}
  td.name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pill{
    display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent);font-weight:600;
  }
  .pill.imp{background:var(--expense-soft);color:var(--expense);}

  .note{font-size:11.5px;color:var(--muted-2);margin-top:16px;line-height:1.6;}
  .note b{color:var(--muted);}

  footer{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }

  @media (max-width: 980px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
  @media (max-width: 520px){
    .kpi-row{grid-template-columns:1fr 1fr;}
    .kpi .value{font-size:19px;}
  }

  .loading{padding:80px 0;text-align:center;color:var(--muted);font-size:13px;}
  .err{padding:20px;text-align:center;color:var(--loss);font-size:13px;}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab-btn{
    background:none;border:none;color:var(--muted);font-family:'Inter';font-size:13px;font-weight:600;
    padding:10px 4px;margin-right:22px;cursor:pointer;border-bottom:2px solid transparent;
    letter-spacing:0.02em;
  }
  .tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width: 900px){ .entry-grid{grid-template-columns:1fr;} }

  form.entry-form{display:flex;flex-direction:column;gap:11px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;display:block;margin-bottom:5px;}
  input, select.entry-input{
    width:100%;background:var(--surface-2);color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:9px 10px;
    font-family:'Inter';font-size:13.5px;
  }
  input:focus, select.entry-input:focus{outline:none;border-color:var(--accent);}
  .computed{
    background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;
    padding:9px 10px;font-size:13px;color:var(--muted);font-family:'IBM Plex Mono',monospace;
  }
  .submit-btn{
    background:var(--accent);color:#1B1305;border:none;border-radius:6px;
    padding:11px 14px;font-family:'Inter';font-size:13.5px;font-weight:700;cursor:pointer;
    margin-top:4px;
  }
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:disabled{opacity:0.5;cursor:default;}
  .submit-btn.expense{background:var(--expense);color:#0B1A1D;}
  .form-msg{font-size:12px;padding:4px 0;min-height:16px;}
  .form-msg.ok{color:var(--profit);}
  .form-msg.bad{color:var(--loss);}

  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px;}
  .mini-table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:0 6px 7px;border-bottom:1px solid var(--line);}
  .mini-table th.r{text-align:right;}
  .mini-table td{padding:7px 6px;border-bottom:1px solid var(--line);}
  .mini-table td.r{text-align:right;}
  .del-btn{
    background:none;border:1px solid var(--line);color:var(--loss);border-radius:5px;
    padding:3px 8px;font-size:11px;cursor:pointer;font-family:'Inter';
  }
  .del-btn:hover{background:rgba(193,102,107,0.12);}
  .section-label{font-size:12px;font-weight:700;color:var(--text);margin:20px 0 4px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="seal"></div>
      <div class="brand-text">
        <h1>Executive Ledger</h1>
        <div class="sub">Sales &amp; Expenses · FY 2026</div>
      </div>
    </div>
    <div class="controls">
      <select id="monthFilter"></select>
      <div class="sync" id="syncTime">loading…</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="entry">Data Entry</button>
  </div>

  <div id="dashboardTab" class="tab-panel active">
    <div id="app">
      <div class="loading">Loading live data from Supabase…</div>
    </div>
  </div>

  <div id="entryTab" class="tab-panel">
    <div class="entry-grid">
      <div class="panel">
        <h2>Add a Sales Invoice</h2>
        <form class="entry-form" id="invoiceForm">
          <div class="field-row">
            <div>
              <label>Invoice Date</label>
              <input type="date" id="inv_date" required>
            </div>
            <div>
              <label>Invoice No.</label>
              <input type="text" id="inv_no" placeholder="e.g. 2839" required>
            </div>
          </div>
          <div>
            <label>Customer</label>
            <input type="text" id="inv_customer" placeholder="Customer name" required>
          </div>
          <div class="field-row">
            <div>
              <label>Product</label>
              <input type="text" id="inv_product" list="productList" placeholder="Product name">
              <datalist id="productList"></datalist>
            </div>
            <div>
              <label>Category</label>
              <input type="text" id="inv_category" list="categoryTypeList" placeholder="محلى / مستورد">
              <datalist id="categoryTypeList">
                <option value="محلى">
                <option value="مستورد">
              </datalist>
            </div>
          </div>
          <div class="field-row">
            <div>
              <label>Quantity</label>
              <input type="number" step="any" id="inv_qty" placeholder="0">
            </div>
            <div>
              <label>Unit Price</label>
              <input type="number" step="any" id="inv_price" placeholder="0">
            </div>
          </div>
          <div>
            <label>Total (auto)</label>
            <div class="computed" id="inv_total_display">0</div>
          </div>
          <div class="field-row">
            <div>
              <label>Unit Cost <span style="text-transform:none;font-weight:400">(optional)</span></label>
              <input type="number" step="any" id="inv_unitcost" placeholder="0">
            </div>
            <div>
              <label>Profit (auto)</label>
              <div class="computed" id="inv_profit_display">0</div>
            </div>
          </div>
          <div>
            <label>Notes <span style="text-transform:none;font-weight:400">(optional)</span></label>
            <input type="text" id="inv_notes" placeholder="e.g. كيلو">
          </div>
          <button type="submit" class="submit-btn" id="inv_submit">Add Invoice</button>
          <div class="form-msg" id="inv_msg"></div>
        </form>

        <div class="section-label">Recent invoices</div>
        <table class="mini-table" id="recentInvoicesTable"></table>
      </div>

      <div class="panel">
        <h2>Add / Update Monthly Expense</h2>
        <form class="entry-form" id="expenseForm">
          <div>
            <label>Month</label>
            <input type="month" id="exp_month" required>
          </div>
          <div>
            <label>Category</label>
            <input type="text" id="exp_category" list="expCategoryList" placeholder="e.g. ايجار" required>
            <datalist id="expCategoryList"></datalist>
          </div>
          <div>
            <label>Amount</label>
            <input type="number" step="any" id="exp_amount" placeholder="0" required>
          </div>
          <div class="form-msg" style="color:var(--muted);min-height:auto;">Entering the same month + category again will update the existing total, not duplicate it.</div>
          <button type="submit" class="submit-btn expense" id="exp_submit">Save Expense</button>
          <div class="form-msg" id="exp_msg"></div>
        </form>

        <div class="section-label">Recent expenses</div>
        <table class="mini-table" id="recentExpensesTable"></table>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://gcugerkjdtmatcjxddbs.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjdWdlcmtqZHRtYXRjanhkZGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTIzOTYsImV4cCI6MjEwMjA4ODM5Nn0.Hjo9xcH2Te_q6tedCfEpBE8pNuCTc9YzIKPqIrIaM2A";

const MONTH_NAMES = {1:'January',2:'February',3:'March',4:'April',5:'May',6:'June',7:'July',8:'August',9:'September',10:'October',11:'November',12:'December'};

function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  return sign + n.toLocaleString('en-US', {maximumFractionDigits:0});
}
function fmtPct(n){ return n.toFixed(1) + '%'; }

async function sb(table, query=''){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${query}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    }
  });
  if(!res.ok) throw new Error(`Failed to load ${table}`);
  return res.json();
}

async function sbWrite(table, method, body, extraHeaders={}, query=''){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...extraHeaders
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(t || `${method} ${table} failed`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function monthStartISO(dateStr){
  // dateStr like 2026-08-15 -> 2026-08-01 ; or 2026-08 (month input) -> 2026-08-01
  const parts = dateStr.split('-');
  return `${parts[0]}-${parts[1]}-01`;
}

let charts = {};
function destroyCharts(){
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

// module-level data store, refreshed after each write
let DATA = { sales: [], expenses: [], invoices: [] };

function effectiveSales(){
  // Invoices are the source of truth for any month that has invoice rows
  // (so newly-entered invoices don't get double-counted against the legacy
  // monthly pivot import). Months with no invoice rows fall back to the
  // imported monthly aggregates.
  const invoiceMonths = new Set(DATA.invoices.filter(r => r.product).map(r => (r.invoice_date||'').slice(0,7)+'-01'));
  const fromPivot = DATA.sales.filter(r => !invoiceMonths.has(r.month));
  const fromInvoicesAgg = {};
  DATA.invoices.forEach(r => {
    if(!r.product) return; // skip payment-only / non-product rows
    const key = (r.invoice_date||'').slice(0,7)+'-01' + '||' + r.product;
    if(!fromInvoicesAgg[key]) fromInvoicesAgg[key] = { month:(r.invoice_date||'').slice(0,7)+'-01', product:r.product, category:r.category, revenue:0, quantity:0 };
    fromInvoicesAgg[key].revenue += Number(r.total)||0;
    fromInvoicesAgg[key].quantity += Number(r.quantity)||0;
  });
  return [...fromPivot, ...Object.values(fromInvoicesAgg)];
}

async function main(){
  try{
    const [sales, expenses, invoices] = await Promise.all([
      sb('abo_sales_monthly'),
      sb('abo_expenses_monthly'),
      sb('abo_invoices_detail')
    ]);
    DATA.sales = sales; DATA.expenses = expenses; DATA.invoices = invoices;
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="err">Could not load data: ${e.message}</div>`;
    return;
  }

  document.getElementById('syncTime').textContent = 'Synced ' + new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  populateEntryHelpers();
  renderRecentTables();

  const currentMonthFilter = document.getElementById('monthFilter').value || 'ALL';
  renderDashboard(currentMonthFilter);
}

function renderDashboard(selectedMonth){
  const sales = effectiveSales();
  const expenses = DATA.expenses;
  const invoices = DATA.invoices;

  // build month list present in data
  const monthSet = Array.from(new Set(sales.map(r => r.month))).sort();
  const filterEl = document.getElementById('monthFilter');
  const prevChoice = filterEl.value;
  filterEl.innerHTML = '<option value="ALL">All months (YTD)</option>' +
    monthSet.map(m => {
      const d = new Date(m);
      return `<option value="${m}">${MONTH_NAMES[d.getUTCMonth()+1]} ${d.getUTCFullYear()}</option>`;
    }).join('');
  if(monthSet.includes(prevChoice) || prevChoice === 'ALL') filterEl.value = prevChoice || 'ALL';

  function render(selectedMonth){
    destroyCharts();
    const salesF = selectedMonth === 'ALL' ? sales : sales.filter(r => r.month === selectedMonth);
    const expF = selectedMonth === 'ALL' ? expenses : expenses.filter(r => r.month === selectedMonth);

    const totalRevenue = salesF.reduce((s,r) => s + Number(r.revenue), 0);
    const totalExpenses = expF.reduce((s,r) => s + Number(r.amount), 0);
    const rawMaterials = expF.filter(r => r.category === 'شراء مواد خام').reduce((s,r)=>s+Number(r.amount),0);
    const netProfit = totalRevenue - totalExpenses;
    const margin = totalRevenue > 0 ? (netProfit/totalRevenue*100) : 0;

    // month-over-month delta (only meaningful for a single selected month, else vs prior period avg)
    let deltaHtml = {rev:'', exp:'', net:''};
    if(selectedMonth !== 'ALL'){
      const idx = monthSet.indexOf(selectedMonth);
      if(idx > 0){
        const prevMonth = monthSet[idx-1];
        const prevRev = sales.filter(r=>r.month===prevMonth).reduce((s,r)=>s+Number(r.revenue),0);
        const prevExp = expenses.filter(r=>r.month===prevMonth).reduce((s,r)=>s+Number(r.amount),0);
        const prevNet = prevRev - prevExp;
        deltaHtml.rev = pctDelta(totalRevenue, prevRev);
        deltaHtml.exp = pctDelta(totalExpenses, prevExp, true);
        deltaHtml.net = pctDelta(netProfit, prevNet);
      }
    }

    function pctDelta(cur, prev, invert){
      if(prev === 0) return '';
      const d = (cur-prev)/Math.abs(prev)*100;
      const good = invert ? d <= 0 : d >= 0;
      const cls = Math.abs(d) < 0.5 ? 'flat' : (good ? 'up':'down');
      const arrow = d >= 0 ? '▲' : '▼';
      return `<span class="delta ${cls}">${arrow} ${Math.abs(d).toFixed(1)}% vs prior month</span>`;
    }

    document.getElementById('app').innerHTML = `
      <div class="kpi-row">
        <div class="kpi accent-top">
          <div class="label">Revenue</div>
          <div class="value num">${fmtMoney(totalRevenue)}</div>
          ${deltaHtml.rev || '<div class="delta flat">&nbsp;</div>'}
        </div>
        <div class="kpi expense-top">
          <div class="label">Raw Materials</div>
          <div class="value num">${fmtMoney(rawMaterials)}</div>
          <div class="delta flat">${totalRevenue? (rawMaterials/totalRevenue*100).toFixed(1):'0.0'}% of revenue</div>
        </div>
        <div class="kpi expense-top">
          <div class="label">Total Expenses</div>
          <div class="value num">${fmtMoney(totalExpenses)}</div>
          ${deltaHtml.exp || '<div class="delta flat">&nbsp;</div>'}
        </div>
        <div class="kpi profit-top">
          <div class="label">Net Profit</div>
          <div class="value num" style="color:${netProfit>=0?'var(--profit)':'var(--loss)'}">${fmtMoney(netProfit)}</div>
          ${deltaHtml.net || '<div class="delta flat">&nbsp;</div>'}
        </div>
        <div class="kpi profit-top">
          <div class="label">Net Margin</div>
          <div class="value num" style="color:${margin>=0?'var(--profit)':'var(--loss)'}">${fmtPct(margin)}</div>
          <div class="delta flat">Net profit / revenue</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h2>Monthly Trend — Revenue vs Expenses</h2>
          <div class="chart-box tall"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="panel">
          <h2>Expense Breakdown${selectedMonth==='ALL'?' (YTD)':''}</h2>
          <div class="chart-box tall"><canvas id="expenseChart"></canvas></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h2>Top Products by Revenue${selectedMonth==='ALL'?' (YTD)':''}</h2>
          <div class="chart-box"><canvas id="productChart"></canvas></div>
        </div>
        <div class="panel">
          <h2>Top Customers <span class="pill">July detail</span></h2>
          <table id="customerTable"></table>
        </div>
      </div>

      <div class="note">
        <b>Notes:</b> Net Profit = Revenue − Total Expenses (Total Expenses already includes raw-material purchases, salaries, rent, and all operating costs). Customer-level detail is only available for July 2026 in the source data; monthly totals for Jan–Jun come from aggregated sales records. Figures assumed to be in EGP based on the source data — adjust if this is a different currency.
      </div>
    `;

    // --- Trend chart (always full year, all months) ---
    const revByMonth = monthSet.map(m => sales.filter(r=>r.month===m).reduce((s,r)=>s+Number(r.revenue),0));
    const expByMonth = monthSet.map(m => expenses.filter(r=>r.month===m).reduce((s,r)=>s+Number(r.amount),0));
    const netByMonth = monthSet.map((m,i) => revByMonth[i]-expByMonth[i]);
    const monthLabels = monthSet.map(m => MONTH_NAMES[new Date(m).getUTCMonth()+1].slice(0,3));

    charts.trend = new Chart(document.getElementById('trendChart'), {
      data: {
        labels: monthLabels,
        datasets: [
          {type:'bar', label:'Revenue', data:revByMonth, backgroundColor:'#D98F30', borderRadius:3, order:2},
          {type:'bar', label:'Expenses', data:expByMonth, backgroundColor:'#4F8C96', borderRadius:3, order:2},
          {type:'line', label:'Net Profit', data:netByMonth, borderColor:'#7CA982', backgroundColor:'#7CA982', tension:0.3, pointRadius:3, order:1}
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index', intersect:false},
        plugins:{ legend:{labels:{color:'#8A93A3', font:{size:11}}}, tooltip:{callbacks:{label:(ctx)=>` ${ctx.dataset.label}: ${fmtMoney(ctx.raw)}`}} },
        scales:{
          x:{ticks:{color:'#8A93A3'}, grid:{color:'#2B3341'}},
          y:{ticks:{color:'#8A93A3', callback:(v)=>fmtMoney(v)}, grid:{color:'#2B3341'}}
        }
      }
    });

    // --- Expense breakdown (selected period) ---
    const expByCategory = {};
    expF.forEach(r => { expByCategory[r.category] = (expByCategory[r.category]||0) + Number(r.amount); });
    const sortedExp = Object.entries(expByCategory).sort((a,b)=>b[1]-a[1]).slice(0,8);
    charts.expense = new Chart(document.getElementById('expenseChart'), {
      type:'bar',
      data:{
        labels: sortedExp.map(e=>e[0]),
        datasets:[{ data: sortedExp.map(e=>e[1]), backgroundColor:'#4F8C96', borderRadius:3 }]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>` ${fmtMoney(ctx.raw)}`}}},
        scales:{
          x:{ticks:{color:'#8A93A3', callback:(v)=>fmtMoney(v)}, grid:{color:'#2B3341'}},
          y:{ticks:{color:'#EDEAE1', font:{size:11}}, grid:{display:false}}
        }
      }
    });

    // --- Top products (selected period) ---
    const prodRev = {};
    salesF.forEach(r => { prodRev[r.product] = (prodRev[r.product]||0) + Number(r.revenue); });
    const sortedProd = Object.entries(prodRev).sort((a,b)=>b[1]-a[1]).slice(0,8);
    charts.product = new Chart(document.getElementById('productChart'), {
      type:'bar',
      data:{
        labels: sortedProd.map(p=>p[0]),
        datasets:[{ data: sortedProd.map(p=>p[1]), backgroundColor:'#D98F30', borderRadius:3 }]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>` ${fmtMoney(ctx.raw)}`}}},
        scales:{
          x:{ticks:{color:'#8A93A3', callback:(v)=>fmtMoney(v)}, grid:{color:'#2B3341'}},
          y:{ticks:{color:'#EDEAE1', font:{size:11}}, grid:{display:false}}
        }
      }
    });

    // --- Top customers table (July invoice-level data, always) ---
    const custAgg = {};
    invoices.forEach(r => {
      if(!r.customer || r.total === 0) return;
      if(!custAgg[r.customer]) custAgg[r.customer] = {revenue:0, profit:0};
      custAgg[r.customer].revenue += Number(r.total);
      custAgg[r.customer].profit += Number(r.profit);
    });
    const sortedCust = Object.entries(custAgg).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,8);
    document.getElementById('customerTable').innerHTML = `
      <thead><tr><th>Customer</th><th class="r">Revenue</th><th class="r">Profit</th></tr></thead>
      <tbody>
        ${sortedCust.map(([name,v]) => `<tr><td class="name">${name}</td><td class="r num">${fmtMoney(v.revenue)}</td><td class="r num" style="color:var(--profit)">${fmtMoney(v.profit)}</td></tr>`).join('')}
      </tbody>
    `;
  }

  render(monthSet.includes(selectedMonth) ? selectedMonth : 'ALL');
}

document.getElementById('monthFilter').addEventListener('change', (e) => renderDashboard(e.target.value));

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
  });
});

// ---------- Data entry helpers ----------
function populateEntryHelpers(){
  const products = Array.from(new Set(DATA.sales.map(r => r.product))).sort();
  document.getElementById('productList').innerHTML = products.map(p => `<option value="${p}">`).join('');

  const cats = Array.from(new Set(DATA.expenses.map(r => r.category))).sort();
  document.getElementById('expCategoryList').innerHTML = cats.map(c => `<option value="${c}">`).join('');

  if(!document.getElementById('inv_date').value){
    document.getElementById('inv_date').value = new Date().toISOString().slice(0,10);
  }
  if(!document.getElementById('exp_month').value){
    document.getElementById('exp_month').value = new Date().toISOString().slice(0,7);
  }
}

function renderRecentTables(){
  const recentInv = [...DATA.invoices].sort((a,b) => b.id - a.id).slice(0,8);
  document.getElementById('recentInvoicesTable').innerHTML = `
    <thead><tr><th>Date</th><th>Customer</th><th>Product</th><th class="r">Total</th><th></th></tr></thead>
    <tbody>
      ${recentInv.map(r => `<tr>
        <td class="num">${r.invoice_date}</td>
        <td class="name">${r.customer||''}</td>
        <td class="name">${r.product||'—'}</td>
        <td class="r num">${fmtMoney(r.total)}</td>
        <td><button class="del-btn" data-type="invoice" data-id="${r.id}">Delete</button></td>
      </tr>`).join('')}
    </tbody>
  `;

  const recentExp = [...DATA.expenses].sort((a,b) => b.id - a.id).slice(0,8);
  document.getElementById('recentExpensesTable').innerHTML = `
    <thead><tr><th>Month</th><th>Category</th><th class="r">Amount</th><th></th></tr></thead>
    <tbody>
      ${recentExp.map(r => `<tr>
        <td class="num">${r.month.slice(0,7)}</td>
        <td class="name">${r.category}</td>
        <td class="r num">${fmtMoney(r.amount)}</td>
        <td><button class="del-btn" data-type="expense" data-id="${r.id}">Delete</button></td>
      </tr>`).join('')}
    </tbody>
  `;

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const table = btn.dataset.type === 'invoice' ? 'abo_invoices_detail' : 'abo_expenses_monthly';
      btn.disabled = true; btn.textContent = '…';
      try{
        await sbWrite(table, 'DELETE', null, {}, `?id=eq.${btn.dataset.id}`);
        await main();
      }catch(e){
        alert('Delete failed: ' + e.message);
        btn.disabled = false; btn.textContent = 'Delete';
      }
    });
  });
}

// ---------- Invoice form ----------
const invQty = document.getElementById('inv_qty');
const invPrice = document.getElementById('inv_price');
const invUnitCost = document.getElementById('inv_unitcost');
function recalcInvoice(){
  const qty = parseFloat(invQty.value)||0;
  const price = parseFloat(invPrice.value)||0;
  const unitCost = parseFloat(invUnitCost.value)||0;
  const total = qty*price;
  const totalCost = qty*unitCost;
  document.getElementById('inv_total_display').textContent = fmtMoney(total);
  document.getElementById('inv_profit_display').textContent = fmtMoney(total-totalCost);
}
[invQty, invPrice, invUnitCost].forEach(el => el.addEventListener('input', recalcInvoice));

document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('inv_submit');
  const msg = document.getElementById('inv_msg');
  btn.disabled = true; btn.textContent = 'Saving…'; msg.textContent=''; msg.className='form-msg';

  const date = document.getElementById('inv_date').value;
  const qty = parseFloat(invQty.value)||0;
  const price = parseFloat(invPrice.value)||0;
  const unitCost = parseFloat(invUnitCost.value)||0;
  const total = qty*price;
  const totalCost = qty*unitCost;
  const monthNames = ['يناير','فبراير','مارس','ابريل','مايو','يونيو','يوليو','اغسطس','سبتمبر','اكتوبر','نوفمبر','ديسمبر'];
  const monthLabel = monthNames[new Date(date+'T00:00:00').getMonth()];

  const row = {
    invoice_date: date,
    invoice_no: document.getElementById('inv_no').value,
    customer: document.getElementById('inv_customer').value,
    product: document.getElementById('inv_product').value || null,
    category: document.getElementById('inv_category').value || null,
    quantity: qty || null,
    unit_price: price || null,
    total: total,
    notes: document.getElementById('inv_notes').value || null,
    month_label: monthLabel,
    unit_cost: unitCost,
    total_cost: totalCost,
    profit: total - totalCost
  };

  try{
    await sbWrite('abo_invoices_detail', 'POST', [row]);
    msg.textContent = 'Invoice added.'; msg.className='form-msg ok';
    document.getElementById('invoiceForm').reset();
    document.getElementById('inv_date').value = date;
    recalcInvoice();
    await main();
  }catch(err){
    msg.textContent = 'Failed: ' + err.message; msg.className='form-msg bad';
  }finally{
    btn.disabled = false; btn.textContent = 'Add Invoice';
  }
});

// ---------- Expense form ----------
document.getElementById('expenseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('exp_submit');
  const msg = document.getElementById('exp_msg');
  btn.disabled = true; btn.textContent = 'Saving…'; msg.textContent=''; msg.className='form-msg';

  const row = {
    month: monthStartISO(document.getElementById('exp_month').value),
    category: document.getElementById('exp_category').value,
    amount: parseFloat(document.getElementById('exp_amount').value)||0
  };

  try{
    await sbWrite('abo_expenses_monthly', 'POST', [row], {'Prefer':'resolution=merge-duplicates,return=representation'}, '?on_conflict=month,category');
    msg.textContent = 'Expense saved.'; msg.className='form-msg ok';
    document.getElementById('exp_category').value = '';
    document.getElementById('exp_amount').value = '';
    await main();
  }catch(err){
    msg.textContent = 'Failed: ' + err.message; msg.className='form-msg bad';
  }finally{
    btn.disabled = false; btn.textContent = 'Save Expense';
  }
});

main();
</script>
